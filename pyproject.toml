[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "devils-advocate-bench"
version = "0.1.0"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dev = ["check-jsonschema>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]
